{{$user := .Data.User}}
<tr id="user-{{$user.ID}}">
    <td>{{$user.ID}}</td>
    <td>{{$user.Email}}</td>
    <td>
        <span class="badge {{if $user.IsActive}}badge-success{{else}}badge-danger{{end}}">
            {{if $user.IsActive}}{{t . "active"}}{{else}}{{t . "inactive"}}{{end}}
        </span>
    </td>
    <td>
        {{if $user.IsSuperuser}}
            <span class="badge badge-warning">{{t . "superuser"}}</span>
        {{else if $user.IsStaff}}
            <span class="badge badge-info">{{t . "staff"}}</span>
        {{else}}
            <span class="badge">{{t . "user"}}</span>
        {{end}}
    </td>
    <td>{{$user.CreatedAt.Format "Jan 2, 2006"}}</td>
    <td class="actions">
        <button 
            hx-get="/users/{{$user.ID}}/edit" 
            hx-target="#modal" 
            hx-swap="innerHTML"
            class="btn-sm btn-secondary">
            {{t . "edit"}}
        </button>
        <button 
            hx-delete="/users/{{$user.ID}}" 
            hx-confirm='{{t . "confirm_delete_user_with_email" $user.Email}}'
            hx-target="#user-{{$user.ID}}" 
            hx-swap="outerHTML swap:1s"
            class="btn-sm btn-danger">
            {{t . "delete"}}
        </button>
    </td>
</tr>
<script>
    // Close modal after successful update
    document.getElementById('modal').innerHTML = '';
</script>
