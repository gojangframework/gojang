{{define "title"}}{{t . "reset_password_title"}}{{end}}

{{define "content"}}
<div class="auth-container">
    <div class="auth-box">
        <h2>{{t . "reset_password"}}</h2>
        <p>{{t . "reset_password_message"}}</p>

        <form hx-post="/reset-password" hx-target="#content" hx-swap="innerHTML" class="form">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <input type="hidden" name="token" value="{{.Data.Token}}">

            <div class="form-group">
                <label for="password">{{t . "password"}}</label>
                <input type="password" id="password" name="password" required autofocus>
                {{if index .Errors "Password"}}
                    <span class="error">{{index .Errors "Password"}}</span>
                {{end}}
            </div>

            <div class="form-group">
                <label for="password_confirm">{{t . "confirm_password"}}</label>
                <input type="password" id="password_confirm" name="password_confirm" required>
                {{if index .Errors "PasswordConfirm"}}
                    <span class="error">{{index .Errors "PasswordConfirm"}}</span>
                {{end}}
            </div>

            <button type="submit" class="btn btn-primary">{{t . "reset_password"}}</button>
        </form>
    </div>
</div>
{{end}}
